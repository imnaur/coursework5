services:
  web:
    build:
      context: .
      dockerfile: Django.Dockerfile
    restart: always
    expose:
      - "8000"
    env_file:
      - .env
    environment:
      - DB_HOST=db
    volumes:
      - django_static:/app/static/
    depends_on:
      - db

  db:
    image: postgres:16-alpine
    restart: always
    env_file:
      - .env
    environment:
      - POSTGRES_DB=${DB_NAME}
      - POSTGRES_USER=${DB_USER}
      - POSTGRES_PASSWORD=${DB_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql
    expose:
      - "5432"


  nginx:
    build:
      context: .
      dockerfile: Nginx.Dockerfile
    restart: always
    ports:
      - "80:80"
    volumes:
      - django_static:/var/www/html/static
    depends_on:
      - web

  redis:
    image: redis
    restart: always
    env_file:
      - .env
    expose:
      - "6379"

  celery:
    build:
      context: .
      dockerfile: Django.Dockerfile
    restart: always
    command: celery -A config worker --loglevel=info
    env_file:
      - .env
    depends_on:
      - db
      - redis

  celery_beat:
    build:
      context: .
      dockerfile: Django.Dockerfile
    restart: always
    command: celery -A config worker --loglevel=info
    env_file:
      - .env
    depends_on:
      - db
      - redis

volumes:
  postgres_data:
  django_static:
